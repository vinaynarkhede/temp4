# ProxyMax Configuration File
# Lines starting with # are comments

# Network Configuration
port=8080
bind_address=0.0.0.0

# Proxy Mode: http, https, socks5, tcp, reverse
mode=http

# Threading Configuration
# Thread model: pool, event, hybrid, perconn
thread_model=pool
num_threads=10

# Feature Flags (0=disabled, 1=enabled)
enable_caching=1
enable_ssl=0
enable_auth=0
enable_logging=1
enable_filtering=1
enable_compression=0
enable_rate_limiting=0

# Cache Settings
cache_size_mb=100
cache_ttl_seconds=3600

# SSL/TLS Settings
ssl_cert=certs/server.crt
ssl_key=certs/server.key

# Authentication
auth_file=config/users.txt

# Reverse Proxy Backend
backend_host=localhost
backend_port=80

# Logging
log_file=proxy.log
log_level=1

# Rate Limiting
rate_limit_requests=100
rate_limit_bandwidth_kbps=10240
