# Production SSL Reverse Proxy Configuration
# High-performance HTTPS reverse proxy with all features enabled

# Network Configuration
port=443
bind_address=0.0.0.0
mode=reverse

# Threading - Hybrid model for best performance
thread_model=hybrid
num_threads=50
max_connections=10000

# SSL/TLS Configuration
enable_ssl=1
ssl_cert=certs/production.crt
ssl_key=certs/production.key

# Load Balancing - Multiple Backends
lb_algorithm=least-connections
num_backends=3
# Format: host:port:weight
backend_1=app-server-1.internal:8080:1
backend_2=app-server-2.internal:8080:1
backend_3=app-server-3.internal:8080:1

# Caching - 1GB cache for static content
enable_caching=1
cache_size_mb=1024
cache_ttl_seconds=3600

# Compression - Reduce bandwidth
enable_compression=1

# Rate Limiting - Protect backends
enable_rate_limiting=1
rate_limit_requests=1000
rate_limit_bandwidth_kbps=102400

# Logging
enable_logging=1
log_file=/var/log/proxymax/access.log
log_level=1

# Content Filtering - Optional
enable_filtering=0

# Authentication - Use backend auth
enable_auth=0
