# Full-Featured Proxy Configuration
# Demonstrates all available features

# Basic Configuration
port=8080
bind_address=0.0.0.0
mode=http

# Threading Model
thread_model=pool
num_threads=20
max_connections=5000

# Enable ALL Features
enable_caching=1
enable_ssl=0
enable_auth=1
enable_logging=1
enable_filtering=1
enable_compression=1
enable_rate_limiting=1

# Caching Configuration
cache_size_mb=500
cache_ttl_seconds=1800

# Authentication
auth_file=config/users.txt

# Rate Limiting
rate_limit_requests=100
rate_limit_bandwidth_kbps=10240

# Logging
log_file=proxy-full.log
log_level=1
