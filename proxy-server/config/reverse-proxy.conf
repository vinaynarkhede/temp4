# Reverse Proxy Configuration
# Load balancing reverse proxy for backend servers

port=80
bind_address=0.0.0.0
mode=reverse
thread_model=hybrid
num_threads=25

# Backend server configuration
backend_host=192.168.1.100
backend_port=8080

# Enable caching for static content
enable_caching=1
cache_size_mb=500
cache_ttl_seconds=7200

# Enable logging
enable_logging=1
log_file=logs/reverse-proxy.log
log_level=1

# Optional: Enable SSL termination
enable_ssl=0
ssl_cert=certs/server.crt
ssl_key=certs/server.key

# Rate limiting to protect backend
enable_rate_limiting=1
rate_limit_requests=1000
rate_limit_bandwidth_kbps=102400

# No auth for reverse proxy
enable_auth=0
enable_filtering=0
enable_compression=0
