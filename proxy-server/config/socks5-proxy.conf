# SOCKS5 Proxy Configuration
# SOCKS5 proxy with authentication

port=1080
bind_address=0.0.0.0
mode=socks5
thread_model=pool
num_threads=15

# Enable authentication
enable_auth=1
auth_file=config/users.txt

# Enable logging
enable_logging=1
log_file=logs/socks5-proxy.log
log_level=1

# IP filtering
enable_filtering=1

# SOCKS5 doesn't use caching
enable_caching=0
enable_ssl=0
enable_compression=0
enable_rate_limiting=0
