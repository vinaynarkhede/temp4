# HTTP Proxy Configuration
# Simple HTTP proxy with caching

port=8080
bind_address=0.0.0.0
mode=http
thread_model=pool
num_threads=20

# Enable caching for better performance
enable_caching=1
cache_size_mb=200
cache_ttl_seconds=3600

# Basic logging
enable_logging=1
log_file=logs/http-proxy.log
log_level=1

# URL filtering
enable_filtering=1

# Other features disabled
enable_ssl=0
enable_auth=0
enable_compression=0
enable_rate_limiting=0
